name: 發布看板

# 抓取在使用者的 Mac 上跑（ADR-0003：591 擋 GitHub 的機房 IP），結果 force push 到孤兒分支 data。
# 這裡只把 data 分支的檔案疊到 site/ 然後部署 Pages。
# 注意：推 data 分支不會觸發這個 workflow（孤兒分支裡沒有 workflow 檔），
# 所以 tools/publish.sh 推完會用 `gh workflow run` 觸發；下面的 branches: [data] 只是保險。

on:
  push:
    branches:
      - main
      - data
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 取 data 分支的抓取結果
        run: |
          if git fetch --depth=1 origin data 2>/dev/null; then
            git show origin/data:data.json > site/data.json
            git show origin/data:fb.json > site/fb.json 2>/dev/null || true
            echo "data.json $(du -h site/data.json | cut -f1)"
          else
            echo "::warning::還沒有 data 分支：Mac 尚未跑過 tools/run-local.sh，先發布沒有資料的網頁"
          fi

      - name: 複製網頁會 import 的 core 模組
        run: cp core/text-extract.mjs core/fb-listing.mjs site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 發布到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
