name: bisect-v13-upload-artifact
on:
  push:
    branches:
      - main
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p out && echo hi > out/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
