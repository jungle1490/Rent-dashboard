name: 維持排程存活

# GitHub 會自動停用「60 天內沒有 repo 活動」的排程工作流程。
# 這個 repo 刻意不把抓取結果 commit 進版控（每半小時一次會把 repo 撐大），
# 所以正常情況下永遠不會有新 commit —— 兩個月後抓取排程就會被停掉。
# 這裡每週推一個極小的時間戳 commit 當作活動證明。
#
# 用 GITHUB_TOKEN 推的 commit 不會觸發其他 workflow，不會造成循環。

on:
  schedule:
    - cron: '17 3 * * 1'   # 每週一 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 更新時間戳並推送
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/last-active
          if git diff --quiet; then
            echo "沒有變化，跳過"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .github/last-active
          git commit -m '維持排程存活'
          git push
