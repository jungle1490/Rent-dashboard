name: bisect-v2-noenv
on:
  push:
    branches:
      - main
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: bisect2
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: 取 data 分支的抓取結果
        run: |
          if git fetch --depth=1 origin data 2>/dev/null; then
            echo "data.json $(git show origin/data:data.json | wc -c)"
          else
            echo "::warning::還沒有 data 分支"
          fi
