<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>台北租屋看板</title>
<style>
:root{
  --bg:#f6f6f4; --panel:#fff; --ink:#1a1a18; --muted:#6b6b66; --line:#e3e3de;
  --accent:#1d6f5c; --accent-soft:#e6f2ee; --warn:#b4521a; --star:#d99400;
  --radius:10px; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#16161a; --panel:#1e1e23; --ink:#eceae5; --muted:#9a978f; --line:#32323a;
    --accent:#57b89c; --accent-soft:#1d3630; --warn:#e08b52; --star:#e5b53c;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif;}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}

/* ---- 版面 ---- */
.wrap{display:grid;grid-template-columns:290px 1fr;gap:20px;max-width:1500px;margin:0 auto;padding:18px}
@media(max-width:900px){
  .wrap{grid-template-columns:1fr;padding:12px;gap:12px;padding-bottom:84px}   /* 底部工具列的高度 */
  header.top{padding-bottom:8px;gap:8px}
  header.top h1{font-size:16px}
  aside{display:none}              /* 手機：篩選收成抽屜，從底部工具列開 */
  aside.open{display:block}
  .swbtn{display:none}             /* 工具列裡有滑卡鈕 */
  .bar select{font-size:12.5px}
}
@media(max-width:600px){ .cards{grid-template-columns:1fr} }

/* ---- 手機底部工具列 ---- */
.mbar{display:none}
@media(max-width:900px){
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;gap:8px;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:var(--panel);border-top:1px solid var(--line)}
  .mbar button{flex:1;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-weight:600;font-size:14px}
  .mbar button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
}

header.top{grid-column:1/-1;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  padding-bottom:12px;border-bottom:1px solid var(--line)}
header.top h1{font-size:17px;margin:0;letter-spacing:.02em}
.stamp{font-size:12px;color:var(--muted)}
.stamp b{color:var(--ink);font-weight:600}

/* ---- 側欄 ---- */
aside{position:sticky;top:14px;align-self:start;max-height:calc(100vh - 28px);overflow-y:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
@media(max-width:900px){ aside{position:static;max-height:none} }
.grp{margin-bottom:16px}
.grp:last-child{margin-bottom:4px}
.grp>h3{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);
  margin:0 0 7px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.grp>h3 button{background:none;border:0;font-size:11px;color:var(--accent);padding:0;letter-spacing:0;text-transform:none}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:4px 10px;font-size:12.5px;
  transition:.12s;white-space:nowrap}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.sub{font-size:11.5px;padding:3px 8px;opacity:.95}
.substations{margin-top:7px;padding:8px;background:var(--bg);border-radius:8px}
.substations .lbl{font-size:11px;color:var(--muted);margin-bottom:6px}
.row{display:flex;gap:7px;align-items:center}
.row input[type=number]{width:100%;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:7px;
  background:var(--bg);color:var(--ink)}
.row span{color:var(--muted);font-size:12px}
input[type=range]{width:100%;accent-color:var(--accent)}
.rangeval{font-size:12px;color:var(--muted);margin-top:2px}
select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink)}
.reset{width:100%;padding:8px;border:1px solid var(--line);background:transparent;border-radius:8px;color:var(--muted);font-size:12.5px}
.reset:hover{border-color:var(--warn);color:var(--warn)}

/* ---- 結果 ---- */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.bar .count{font-size:13px;color:var(--muted)}
.bar .count b{color:var(--ink);font-size:15px}
.bar .spacer{flex:1}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px}
.tabs button{border:0;background:none;padding:4px 11px;border-radius:6px;font-size:12.5px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.bar select{width:auto}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative;transition:.14s}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.card.is-hidden{opacity:.38}
.card.is-gone{opacity:.5}
.thumb{aspect-ratio:4/3;background:var(--bg);position:relative;display:block}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.more{margin:18px auto 4px;display:block;padding:10px 22px;border:1px solid var(--line);
  background:var(--panel);border-radius:8px;color:var(--muted)}
.more:hover{border-color:var(--accent);color:var(--accent)}
.badges{position:absolute;top:8px;left:8px;display:flex;gap:5px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:600;padding:2.5px 7px;border-radius:5px;background:rgba(0,0,0,.72);color:#fff;backdrop-filter:blur(4px)}
.badge.new{background:var(--accent)}
.badge.drop{background:var(--warn)}
.badge.gone{background:#666}
.badge.seen{background:rgba(0,0,0,.45);font-weight:500}
.badge.src{background:#1877f2}
.badge.seek{background:#7c3aed}
.unk{color:var(--muted);font-style:normal}
.imp textarea{width:100%;min-height:180px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:12px/1.5 ui-monospace,Menlo,monospace}
.imp .msg{font-size:12.5px;margin-top:8px;color:var(--muted)}
.imp .msg.err{color:var(--warn)}
.raw{white-space:pre-wrap;font-size:13px;line-height:1.6;padding:12px;background:var(--bg);border-radius:8px;margin:12px 0;max-height:40vh;overflow:auto}
.acts{position:absolute;top:8px;right:8px;display:flex;gap:5px}
.acts button{width:29px;height:29px;border-radius:7px;border:0;background:rgba(0,0,0,.62);color:#fff;
  display:grid;place-items:center;font-size:14px;backdrop-filter:blur(4px);line-height:1}
.acts button:hover{background:rgba(0,0,0,.85)}
.acts button.on{background:var(--star);color:#1a1a18}
.body{padding:11px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.price{font-size:19px;font-weight:700;letter-spacing:-.01em}
.price small{font-size:11.5px;font-weight:400;color:var(--muted);margin-left:3px}
.fee{font-size:11.5px;color:var(--warn)}
.fee.none{color:var(--muted)}
.fee.inc{color:var(--accent)}
.ttl{font-size:13.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;text-decoration:none;font-weight:500}
.ttl:hover{color:var(--accent)}
.meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 9px}
.mrt{font-size:12px;color:var(--accent);font-weight:500}
.tagrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto;padding-top:4px}
.tg{font-size:10.5px;padding:2px 6px;border-radius:4px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.swbtn{padding:6px 12px;border:1px solid var(--accent);border-radius:8px;background:var(--accent-soft);
  color:var(--accent);font-weight:600;font-size:12.5px}

/* ---- 篩選抽屜：滑卡模式（或手機）時把側欄疊成全螢幕面板 ---- */
aside.open{position:fixed;inset:0;z-index:55;max-height:none;max-width:560px;margin:0 auto;
  border-radius:0;padding:14px 14px 20px;overflow-y:auto;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
.done{display:none}
aside.open .done{display:block;position:sticky;bottom:0;width:100%;padding:13px;border:0;border-radius:10px;
  background:var(--accent);color:#fff;font-weight:600;font-size:15px;margin-top:12px}

/* ---- 滑卡模式 ---- */
.sw{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;flex-direction:column}
.sw .hd{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.sw .hd .t{font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw .hd .t small{color:var(--muted);font-weight:400;margin-left:6px}
.sw .hd button{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;font-size:12.5px;white-space:nowrap}
.sw .hd button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:14px;overflow:hidden}
.sc{position:absolute;width:min(92vw,440px);height:min(76vh,680px);max-height:calc(100% - 8px);border-radius:16px;overflow:hidden;
  background:#111;box-shadow:0 14px 40px rgba(0,0,0,.35);touch-action:none;user-select:none;-webkit-user-select:none;will-change:transform}
.sc.back{transform:scale(.95) translateY(12px);opacity:.6;pointer-events:none}
.sc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none}
.sc .dots{position:absolute;top:10px;left:12px;right:12px;display:flex;gap:4px;z-index:2}
.sc .dots i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35)}
.sc .dots i.on{background:#fff}
.sc .nb{position:absolute;top:22px;left:12px;z-index:3;font-size:11px;font-weight:600;padding:2.5px 7px;border-radius:5px;background:var(--accent);color:#fff}
.sc .info{position:absolute;left:0;right:0;bottom:0;padding:70px 16px 16px;color:#fff;z-index:2;
  background:linear-gradient(transparent,rgba(0,0,0,.85))}
.sc .info .p{font-size:26px;font-weight:700}
.sc .info .p small{font-size:12px;font-weight:400;opacity:.8;margin-left:4px}
.sc .info .f{font-size:12.5px;opacity:.9;margin-top:2px}
.sc .info .tt{font-size:14px;font-weight:500;margin-top:6px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sc .info .m{font-size:12px;opacity:.85;margin-top:4px}
.sc .stamp{position:absolute;top:44px;padding:6px 14px;border:3px solid;border-radius:8px;font-size:22px;font-weight:800;
  letter-spacing:.1em;z-index:3;opacity:0;pointer-events:none}
.sc .stamp.like{right:22px;color:#4ade80;border-color:#4ade80;transform:rotate(14deg)}
.sc .stamp.nope{left:22px;color:#f87171;border-color:#f87171;transform:rotate(-14deg)}
.sc .det{position:absolute;right:12px;bottom:12px;z-index:3;padding:6px 12px;border:1px solid rgba(255,255,255,.5);
  border-radius:8px;background:rgba(0,0,0,.45);color:#fff;font-size:12.5px;backdrop-filter:blur(4px)}
.swacts{display:flex;justify-content:center;align-items:center;gap:18px;padding:12px 12px calc(16px + env(safe-area-inset-bottom));
  background:var(--panel);border-top:1px solid var(--line)}
.swacts button{width:58px;height:58px;border-radius:50%;border:2px solid var(--line);background:var(--panel);font-size:22px;display:grid;place-items:center}
.swacts .no{color:#f87171;border-color:#f87171}
.swacts .yes{color:var(--star);border-color:var(--star)}
.swacts .un{width:46px;height:46px;font-size:16px;color:var(--muted)}
.swacts button:disabled{opacity:.35}
.swempty{text-align:center;color:var(--muted);padding:40px 24px;max-width:360px;line-height:1.7}
.swempty b{display:block;font-size:18px;color:var(--ink);margin-bottom:8px}

/* ---- 詳細面板 ---- */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:20px}
@media(max-width:700px){ .ov{padding:0;align-items:stretch} }
.dlg{background:var(--panel);border-radius:12px;max-width:880px;width:100%;max-height:100%;
  overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.35);position:relative}
@media(max-width:700px){ .dlg{border-radius:0} }
.dlg .x{position:absolute;top:12px;right:12px;z-index:2;width:34px;height:34px;border:0;border-radius:9px;
  background:rgba(0,0,0,.62);color:#fff;font-size:17px;backdrop-filter:blur(4px)}
.gal{position:relative;background:#000}
.gal img{width:100%;aspect-ratio:4/3;object-fit:contain;display:block}
.gal .nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;
  border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:16px}
.gal .nav.prev{left:10px} .gal .nav.next{right:10px}
.gal .idx{position:absolute;bottom:10px;right:12px;background:rgba(0,0,0,.6);color:#fff;
  font-size:11.5px;padding:3px 8px;border-radius:5px}
.strip{display:flex;gap:6px;padding:8px;overflow-x:auto;background:var(--bg)}
.strip img{width:64px;height:48px;object-fit:cover;border-radius:5px;cursor:pointer;opacity:.55;flex:none}
.strip img.on{opacity:1;outline:2px solid var(--accent)}
.dbody{padding:16px 18px 18px}
.dprice{font-size:26px;font-weight:700;letter-spacing:-.02em}
.dprice small{font-size:12px;font-weight:400;color:var(--muted);margin-left:4px}
.dsum{font-size:12.5px;margin:4px 0 12px}
.dttl{font-size:16px;font-weight:600;line-height:1.5;margin:0 0 12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;
  padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fact .k{font-size:11px;color:var(--muted);margin-bottom:2px}
.fact .v{font-size:13.5px;font-weight:500}
.dtags{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0}
.dacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.dacts button,.dacts a{flex:1;min-width:130px;text-align:center;padding:10px 14px;border-radius:9px;
  border:1px solid var(--line);background:transparent;text-decoration:none;font-size:13.5px;font-weight:500}
.dacts .go{background:var(--accent);border-color:var(--accent);color:#fff}
.dacts .on{background:var(--star);border-color:var(--star);color:#1a1a18}
.hint{font-size:11.5px;color:var(--muted);text-align:center;margin-top:10px}
.err{padding:16px;border:1px solid var(--warn);border-radius:var(--radius);color:var(--warn);background:var(--panel)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>台北租屋看板</h1>
    <div class="stamp" id="stamp">載入中…</div>
  </header>

  <aside id="filters">
    <div class="grp">
      <h3>來源 <button id="impOpen">匯入 FB 貼文</button></h3>
      <div class="chips" id="srcChips"></div>
      <div class="chips" style="margin-top:6px">
        <button class="chip sub" id="hideUnk">隱藏未標欄位的物件</button>
        <button class="chip sub" id="showSeek">顯示求租貼文</button>
      </div>
    </div>

    <div class="grp">
      <h3>捷運路線 <button data-clear="lines">清除</button></h3>
      <div class="chips" id="lineChips"></div>
      <div id="stationBox"></div>
    </div>

    <div class="grp">
      <h3>離捷運站</h3>
      <input type="range" id="dist" min="200" max="2000" step="100" value="2000">
      <div class="rangeval" id="distVal"></div>
    </div>

    <div class="grp">
      <h3>行政區 <button data-clear="districts">清除</button></h3>
      <div class="chips" id="distChips"></div>
    </div>

    <div class="grp">
      <h3>租金</h3>
      <div class="row">
        <input type="number" id="pMin" placeholder="不限" step="1000">
        <span>—</span>
        <input type="number" id="pMax" placeholder="不限" step="1000">
      </div>
      <div class="chips" style="margin-top:7px">
        <button class="chip sub" data-basis="rent">區間比租金</button>
        <button class="chip sub" data-basis="total">區間比總額（含額外費用）</button>
      </div>
      <div class="chips" style="margin-top:5px">
        <button class="chip sub" data-fee="all" aria-pressed="true">不限額外費用</button>
        <button class="chip sub" data-fee="none" aria-pressed="false">只看無額外費用</button>
      </div>
    </div>

    <div class="grp">
      <h3>租金已包含 <button data-clear="contains">清除</button></h3>
      <div class="chips" id="containChips"></div>
    </div>

    <div class="grp">
      <h3>坪數 / 房型</h3>
      <div class="row">
        <input type="number" id="aMin" placeholder="最小坪" step="1">
        <span>—</span>
        <input type="number" id="aMax" placeholder="最大坪" step="1">
      </div>
      <div class="chips" id="layoutChips" style="margin-top:7px"></div>
    </div>

    <div class="grp">
      <h3>房屋類型</h3>
      <div class="chips" id="kindChips"></div>
    </div>

    <div class="grp">
      <h3>出租方</h3>
      <div class="chips" id="roleChips"></div>
    </div>

    <div class="grp">
      <h3>條件 <button data-clear="tags">清除</button></h3>
      <div class="chips" id="tagChips"></div>
    </div>

    <button class="reset" id="resetAll">重設所有條件</button>
    <button class="done" id="filtDone">完成</button>
  </aside>

  <main>
    <div class="bar">
      <div class="count" id="count"></div>
      <div class="tabs" id="viewTabs">
        <button data-view="active" aria-selected="true">全部</button>
        <button data-view="saved" aria-selected="false">收藏</button>
        <button data-view="unseen" aria-selected="false">未看過</button>
        <button data-view="hidden" aria-selected="false">已排除</button>
      </div>
      <div class="spacer"></div>
      <button class="swbtn" id="swOpen">⚡ 滑卡</button>
      <select id="sort">
        <option value="new">最新上架</option>
        <option value="priceAsc">租金 低→高</option>
        <option value="priceDesc">租金 高→低</option>
        <option value="areaDesc">坪數 大→小</option>
        <option value="unit">每坪單價 低→高</option>
        <option value="distAsc">離捷運 近→遠</option>
      </select>
    </div>
    <div id="out"></div>
  </main>

  <div class="mbar">
    <button id="mFilt">篩選</button>
    <button class="pri" id="mSwipe">⚡ 滑卡</button>
  </div>
</div>

<script>
const LS = {
  saved:  new Set(JSON.parse(localStorage.getItem('rent591.saved')  || '[]')),
  hidden: new Set(JSON.parse(localStorage.getItem('rent591.hidden') || '[]')),
  // 「已看」與「排除」是兩回事：已看只是滑過／開過，在「全部」裡仍要顯示
  seen:   new Set(JSON.parse(localStorage.getItem('rent591.seen')   || '[]')),
};
const persist = (k) => localStorage.setItem('rent591.' + k, JSON.stringify([...LS[k]]));

const F = {  // 目前篩選狀態
  lines:new Set(), stations:new Set(), districts:new Set(), layouts:new Set(),
  kinds:new Set(), tags:new Set(), contains:new Set(), sources:new Set(), role:'all', fee:'all', basis:'rent', dist:2000,
  hideUnknown:false, showSeeking:false,
  pMin:null, pMax:null, aMin:null, aMax:null, view:'active', sort:'new',
};
const SAVED_F = 'rent591.filters';
try { Object.assign(F, JSON.parse(localStorage.getItem(SAVED_F) || '{}'),
  {lines:new Set(JSON.parse(localStorage.getItem(SAVED_F)||'{}').lines||[]),
   stations:new Set(JSON.parse(localStorage.getItem(SAVED_F)||'{}').stations||[]),
   districts:new Set(JSON.parse(localStorage.getItem(SAVED_F)||'{}').districts||[]),
   layouts:new Set(JSON.parse(localStorage.getItem(SAVED_F)||'{}').layouts||[]),
   kinds:new Set(JSON.parse(localStorage.getItem(SAVED_F)||'{}').kinds||[]),
   tags:new Set(JSON.parse(localStorage.getItem(SAVED_F)||'{}').tags||[]),
   contains:new Set(JSON.parse(localStorage.getItem(SAVED_F)||'{}').contains||[]),
   sources:new Set(JSON.parse(localStorage.getItem(SAVED_F)||'{}').sources||[])}); } catch {}
const saveF = () => localStorage.setItem(SAVED_F, JSON.stringify({...F,
  lines:[...F.lines], stations:[...F.stations], districts:[...F.districts],
  layouts:[...F.layouts], kinds:[...F.kinds], tags:[...F.tags], contains:[...F.contains], sources:[...F.sources]}));

const DISTRICT_ORDER = ['中正區','大同區','中山區','松山區','大安區','萬華區','信義區',
  '士林區','北投區','內湖區','南港區','文山區'];
const USEFUL_TAGS = ['可養寵物','可開伙','可報稅','有電梯','租金補貼','屋主直租','拎包入住',
  '近商圈','隨時可遷入','有車位','免管理費','社會住宅'];
const CONTAIN_ORDER = ['管理費','水費','電費','網路','第四臺','瓦斯費','清潔費','車位租金'];
const CONTAIN_LABEL = {'第四臺':'第四台'};

let DATA = null;
const $ = (s) => document.querySelector(s);
const NEW_MS = 36 * 3600 * 1000;   // 36 小時內首次出現 = 新上架
// 第一次跑的時候所有物件的 firstSeen 都是當下，全部標新上架沒有意義，
// 所以比例過高時就整個關掉，等累積幾輪之後自然會恢復正常。
let NEW_MEANINGFUL = true;
const isNew = (l) => NEW_MEANINGFUL && !l.gone &&
  Date.now() - new Date(l.firstSeen).getTime() < NEW_MS;

/* ---------- 篩選 ---------- */
// 社群貼文抽不到的欄位是 null：篩選時「不知道」預設放行，開了「隱藏未標」才排除。
// 591 的欄位永遠有值（沒捷運是 ''／null 但 source 不是 fb），行為跟以前一樣。
const unk = (l, v) => l.source === 'fb' && (v == null || v === '');
function matches(l) {
  if (F.sources.size && !F.sources.has(l.source || '591')) return false;
  if (l.isSeeking && !F.showSeeking) return false;
  if (F.hideUnknown && l.source === 'fb' && (l.price == null || !l.district)) return false;
  if (F.lines.size) {
    if (unk(l, l.station)) { /* 不知道站，放行 */ }
    else {
      if (!l.lines.some((x) => F.lines.has(x))) return false;
      if (F.stations.size && !F.stations.has(l.station)) return false;
    }
  }
  if (F.dist < 2000 && !unk(l, l.stationDist)) { if (l.stationDist == null || l.stationDist > F.dist) return false; }
  if (F.districts.size && !unk(l, l.district) && !F.districts.has(l.district)) return false;
  // 「總額」把額外費用一起算進去，避免 29,000 + 3,000 管理費被當成 3 萬以內
  const effPrice = l.price == null ? null : (F.basis === 'total' ? l.price + (l.extraFee || 0) : l.price);
  if (effPrice != null) {
    if (F.pMin != null && effPrice < F.pMin) return false;
    if (F.pMax != null && effPrice > F.pMax) return false;
  }
  if (F.fee === 'none' && l.extraFee > 0) return false;
  if (l.area != null && l.area > 0) {
    if (F.aMin != null && l.area < F.aMin) return false;
    if (F.aMax != null && l.area > F.aMax) return false;
  }
  if (F.layouts.size && !unk(l, l.layout) && !F.layouts.has(layoutBucket(l))) return false;
  if (F.kinds.size && !unk(l, l.kind) && !F.kinds.has(l.kind)) return false;
  if (F.role === 'owner' && !/屋主/.test(l.role)) return false;
  if (F.role === 'agent' && !/仲介|代理/.test(l.role)) return false;
  for (const t of F.tags) if (!l.tags.includes(t)) return false;
  for (const c of F.contains) if (!(l.contains || []).includes(c)) return false;
  return true;
}
function layoutBucket(l) {
  const m = (l.layout || '').match(/(\d+)房/);
  if (!m) return '其他';
  const n = +m[1];
  return n >= 3 ? '3房以上' : n + '房';
}
const eff = (l) => l.price == null ? null : (F.basis === 'total' ? l.price + (l.extraFee || 0) : l.price);
const nz = (v, last) => (v == null ? last : v);   // 未標的排最後
const SORTS = {
  new:       (a,b) => new Date(b.firstSeen) - new Date(a.firstSeen),
  priceAsc:  (a,b) => nz(eff(a), 1e12) - nz(eff(b), 1e12),
  priceDesc: (a,b) => nz(eff(b), -1) - nz(eff(a), -1),
  areaDesc:  (a,b) => nz(b.area, -1) - nz(a.area, -1),
  unit:      (a,b) => (a.price && a.area ? a.price/a.area : 1e12) - (b.price && b.area ? b.price/b.area : 1e12),
  distAsc:   (a,b) => (a.stationDist ?? 1e9) - (b.stationDist ?? 1e9),
};

/* ---------- 畫面 ---------- */
function chip(label, on, onClick, cls='') {
  const b = document.createElement('button');
  b.className = 'chip ' + cls; b.textContent = label;
  b.setAttribute('aria-pressed', on ? 'true' : 'false');
  b.onclick = onClick;
  return b;
}
function toggle(set, v) { set.has(v) ? set.delete(v) : set.add(v); }

function renderFilters() {
  // 捷運路線
  const lc = $('#lineChips'); lc.innerHTML = '';
  for (const line of Object.keys(DATA.mrtLines)) {
    lc.append(chip(line, F.lines.has(line), () => {
      toggle(F.lines, line);
      // 取消路線時，一併清掉它底下已選的站
      if (!F.lines.has(line)) for (const s of DATA.mrtLines[line]) F.stations.delete(s);
      render();
    }));
  }
  // 已選路線的站（可再細選）
  const sb = $('#stationBox'); sb.innerHTML = '';
  if (F.lines.size) {
    const stations = [...new Set([...F.lines].flatMap((l) => DATA.mrtLines[l]))]
      .filter((s) => STATION_COUNT[s]);
    if (stations.length) {
      const box = document.createElement('div'); box.className = 'substations';
      const lbl = document.createElement('div'); lbl.className = 'lbl';
      lbl.textContent = F.stations.size ? `已選 ${F.stations.size} 站` : '（可再選特定站，不選＝整條線）';
      box.append(lbl);
      const row = document.createElement('div'); row.className = 'chips';
      for (const s of stations) {
        row.append(chip(`${s}·${STATION_COUNT[s]}`, F.stations.has(s),
          () => { toggle(F.stations, s); render(); }, 'sub'));
      }
      box.append(row); sb.append(box);
    }
  }
  // 行政區
  const dc = $('#distChips'); dc.innerHTML = '';
  for (const d of DISTRICTS) {
    dc.append(chip(`${d}·${DISTRICT_COUNT[d]}`, F.districts.has(d),
      () => { toggle(F.districts, d); render(); }));
  }
  // 房型 / 類型 / 出租方 / 條件
  const lay = $('#layoutChips'); lay.innerHTML = '';
  for (const v of ['1房','2房','3房以上']) {
    lay.append(chip(v, F.layouts.has(v), () => { toggle(F.layouts, v); render(); }, 'sub'));
  }
  const kc = $('#kindChips'); kc.innerHTML = '';
  for (const k of KINDS) kc.append(chip(k, F.kinds.has(k), () => { toggle(F.kinds, k); render(); }, 'sub'));

  const rc = $('#roleChips'); rc.innerHTML = '';
  for (const [v, label] of [['all','不限'],['owner','屋主直租'],['agent','仲介']]) {
    rc.append(chip(label, F.role === v, () => { F.role = v; render(); }, 'sub'));
  }
  const sc = $('#srcChips'); sc.innerHTML = '';
  for (const [v, label] of [['591', `591·${SRC_COUNT['591'] || 0}`], ['fb', `FB·${SRC_COUNT.fb || 0}`]]) {
    sc.append(chip(label, F.sources.has(v), () => { toggle(F.sources, v); render(); }));
  }
  $('#hideUnk').setAttribute('aria-pressed', String(F.hideUnknown));
  $('#hideUnk').onclick = () => { F.hideUnknown = !F.hideUnknown; render(); };
  $('#showSeek').setAttribute('aria-pressed', String(F.showSeeking));
  $('#showSeek').onclick = () => { F.showSeeking = !F.showSeeking; render(); };
  const cc = $('#containChips'); cc.innerHTML = '';
  for (const c of CONTAIN_ORDER.filter((c) => CONTAIN_COUNT[c])) {
    cc.append(chip(`${CONTAIN_LABEL[c] || c}·${CONTAIN_COUNT[c]}`, F.contains.has(c),
      () => { toggle(F.contains, c); render(); }, 'sub'));
  }
  const tc = $('#tagChips'); tc.innerHTML = '';
  for (const t of USEFUL_TAGS.filter((t) => TAG_COUNT[t])) {
    tc.append(chip(t, F.tags.has(t), () => { toggle(F.tags, t); render(); }, 'sub'));
  }
  // 額外費用
  document.querySelectorAll('[data-basis]').forEach((b) => {
    b.setAttribute('aria-pressed', F.basis === b.dataset.basis ? 'true' : 'false');
    b.onclick = () => { F.basis = b.dataset.basis; render(); };
  });
  document.querySelectorAll('[data-fee]').forEach((b) => {
    b.setAttribute('aria-pressed', F.fee === b.dataset.fee ? 'true' : 'false');
    b.onclick = () => { F.fee = b.dataset.fee; render(); };
  });
  $('#dist').value = F.dist;
  $('#distVal').textContent = F.dist >= 2000 ? '不限' : `${F.dist} 公尺內（會排除非捷運物件）`;
  $('#pMin').value = F.pMin ?? ''; $('#pMax').value = F.pMax ?? '';
  $('#aMin').value = F.aMin ?? ''; $('#aMax').value = F.aMax ?? '';
  $('#sort').value = F.sort;
  document.querySelectorAll('#viewTabs button').forEach((b) =>
    b.setAttribute('aria-selected', F.view === b.dataset.view ? 'true' : 'false'));
}

function card(l) {
  const el = document.createElement('div');
  el.className = 'card' + (LS.hidden.has(l.id) ? ' is-hidden' : '') + (l.gone ? ' is-gone' : '');

  const badges = [];
  if (l.gone) badges.push('<span class="badge gone">已下架</span>');
  else if (isNew(l)) badges.push('<span class="badge new">新上架</span>');
  if (l.source === 'fb') badges.push('<span class="badge src">FB</span>');
  if (l.isSeeking) badges.push('<span class="badge seek">求租</span>');
  if (LS.seen.has(l.id)) badges.push('<span class="badge seen">已看</span>');
  if (l.prevPrice && l.prevPrice > l.price)
    badges.push(`<span class="badge drop">↓ ${(l.prevPrice - l.price).toLocaleString()}</span>`);

  const inc = (l.contains || []).map((c) => CONTAIN_LABEL[c] || c);
  const fee = l.extraFee > 0
    ? `<div class="fee">＋額外費用 ${l.extraFee.toLocaleString()} 元/月${l.price != null ? `（合計約 ${(l.price + l.extraFee).toLocaleString()}）` : ''}</div>`
    : l.feeIncluded ? `<div class="fee inc">含管理費</div>`
    : inc.length
      ? `<div class="fee inc">租金含 ${inc.join('、')}</div>`
      : `<div class="fee none">未註明額外費用</div>`;


  el.innerHTML = `
    <a class="thumb" href="${l.url}" target="_blank" rel="noopener">
      ${l.cover ? `<img src="${l.cover}" loading="lazy" decoding="async" alt="">` : ''}
      <div class="badges">${badges.join('')}</div>
    </a>
    <div class="acts">
      <button data-act="save" class="${LS.saved.has(l.id) ? 'on' : ''}" title="收藏">${LS.saved.has(l.id) ? '★' : '☆'}</button>
      <button data-act="hide" title="${LS.hidden.has(l.id) ? '取消排除' : '排除，不再顯示'}">${LS.hidden.has(l.id) ? '↺' : '✕'}</button>
    </div>
    <div class="body">
      <div class="price">${D.price(l)}</div>
      ${fee}
      <a class="ttl" href="${l.url}" target="_blank" rel="noopener">${escapeHtml(l.title)}</a>
      <div class="meta">
        <span>${D.district(l)}</span><span>${D.kind(l)}</span>
        <span>${l.layout || '—'}</span><span>${D.area(l)}</span><span>${D.floor(l)}</span>
      </div>
      <div class="mrt"${l.station ? '' : ' style="color:var(--muted)"'}>${D.mrt(l)}</div>
      <div class="meta" style="font-size:11.5px">${escapeHtml(D.where(l))}${l.role ? '　·　' + escapeHtml(l.role) : ''}</div>
      <div class="tagrow">${l.tags.slice(0,5).map((t)=>`<span class="tg">${escapeHtml(t)}</span>`).join('')}</div>
    </div>`;

  for (const a of el.querySelectorAll('.thumb, .ttl')) {
    a.addEventListener('click', (e) => {
      // 讓 cmd/ctrl/shift+click 和中鍵維持原本「在新分頁開 591」的行為
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
      e.preventDefault();
      openDetail(l);
    });
  }
  el.querySelector('[data-act=save]').onclick = () => {
    LS.saved.has(l.id) ? LS.saved.delete(l.id) : LS.saved.add(l.id); persist('saved'); render(true);
  };
  el.querySelector('[data-act=hide]').onclick = () => {
    LS.hidden.has(l.id) ? LS.hidden.delete(l.id) : LS.hidden.add(l.id); persist('hidden'); render(true);
  };
  return el;
}
// 顯示用：FB 貼文抽不到的欄位顯示「未標」，不要印出 null
const D = {
  price:    (l) => l.price == null ? '<span class="unk">未標價</span>' : l.price.toLocaleString() + '<small>元/月</small>',
  district: (l) => l.district || (l.outsideTaipei ? '台北市外' : '未標區'),
  kind:     (l) => l.kind || '未標類型',
  area:     (l) => l.area ? l.area + ' 坪' : '未標坪數',
  floor:    (l) => l.floor || '',
  srcName:  (l) => l.source === 'fb' ? 'Facebook' : '591',
  where:    (l) => l.source === 'fb' ? (l.group || 'FB 社團') : l.address,
  mrt:      (l) => l.station
    ? `🚇 ${l.station}　${l.stationDist == null ? '' : (l.stationDistApprox ? '約' : '') + l.stationDist + ' 公尺'}　${(l.lines || []).join('／')}`
    : (l.source === 'fb' ? '未標捷運' : '非捷運周邊'),
};
const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g,
  (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let lastShown = 0;   // 上次展開到第幾筆；render(true) 會保留，免得收藏一下清單就跳回前 60 筆
function render(keep = false) {
  saveF();
  renderFilters();
  let list = DATA.listings.filter(matches);
  if (F.view === 'saved')       list = list.filter((l) => LS.saved.has(l.id));
  else if (F.view === 'hidden') list = list.filter((l) => LS.hidden.has(l.id));
  else if (F.view === 'unseen') list = list.filter((l) => !LS.hidden.has(l.id) && !LS.seen.has(l.id));
  else                          list = list.filter((l) => !LS.hidden.has(l.id));
  list.sort(SORTS[F.sort]);
  // 新上架與收藏永遠排前面（依「最新上架」排序時）
  if (F.sort === 'new') list.sort((a, b) => (isNew(b) - isNew(a)));

  const newCount = list.filter(isNew).length;
  const unseenTotal = DATA.listings.filter((l) => !l.gone && !LS.hidden.has(l.id) && !LS.seen.has(l.id)).length;
  $('#count').innerHTML = `<b>${list.length}</b> 筆` +
    (newCount ? `　·　<span style="color:var(--accent)">${newCount} 筆新上架</span>` : '') +
    `　·　收藏 ${LS.saved.size}　排除 ${LS.hidden.size}　未看 ${unseenTotal}`;
  if (SW.open) swDraw();   // 滑卡開著時佇列跟著篩選變

  const out = $('#out'); out.innerHTML = '';
  if (!list.length) {
    out.innerHTML = '<div class="empty">沒有符合條件的物件<br><small>試著放寬捷運距離或價格範圍</small></div>';
    return;
  }
  // 分批塞進 DOM：一次幾千張卡片會讓瀏覽器卡住
  const grid = document.createElement('div'); grid.className = 'cards';
  out.append(grid);
  let shown = 0;
  const PAGE = 60;
  const initial = keep ? Math.max(PAGE, lastShown) : PAGE;
  const moreBtn = document.createElement('button');
  moreBtn.className = 'more';
  const showMore = () => {
    const slice = list.slice(shown, shown + (shown === 0 ? initial : PAGE));
    const frag = document.createDocumentFragment();
    for (const l of slice) frag.append(card(l));
    grid.append(frag);
    shown += slice.length;
    lastShown = shown;
    if (shown >= list.length) { moreBtn.remove(); io.disconnect(); }
    else moreBtn.textContent = `載入更多（還有 ${list.length - shown} 筆）`;
  };
  // 捲到底自動載入，按鈕當備援
  const io = new IntersectionObserver((es) => { if (es[0].isIntersecting) showMore(); },
    { rootMargin: '600px' });
  showMore();
  if (shown < list.length) { out.append(moreBtn); moreBtn.onclick = showMore; io.observe(moreBtn); }
}

/* ---------- 詳細面板 ----------
   用 history.pushState 開啟，所以瀏覽器「上一頁」就是關閉面板回到看板，
   不會整個離開清單、也不用重設篩選條件。手機的返回手勢同理。            */
let BY_ID = new Map();
let galIdx = 0, galPhotos = [];

function openDetail(l) {
  history.pushState({ detail: l.id, swipe: SW.open ? 1 : 0 }, '', '#p' + l.id);
  // 從看板開面板算「已看」；從滑卡開不算——已看由滑的方向決定，
  // 否則 render() 重算佇列，面板底下那張卡會消失
  if (!SW.open && !LS.seen.has(l.id)) { LS.seen.add(l.id); persist('seen'); render(true); }
  showDetail(l);
}
function showDetail(l) {
  galPhotos = (l.photos && l.photos.length ? l.photos : [l.cover]).filter(Boolean);
  galIdx = 0;
  let ov = document.querySelector('.ov');
  if (!ov) {
    ov = document.createElement('div');
    ov.className = 'ov';
    ov.addEventListener('click', (e) => { if (e.target === ov) closeDetail(); });
    document.body.append(ov);
  }
  document.body.style.overflow = 'hidden';
  ov.innerHTML = detailHtml(l);
  wireDetail(ov, l);
}
function closeDetail() {
  // 統一走 history：按 ✕ / Esc / 點背景都等同上一頁，狀態才不會對不上
  if (history.state && history.state.detail) history.back();
  else hideDetail();
}
function hideDetail() {
  document.querySelector('.ov')?.remove();
  document.body.style.overflow = SW.open ? 'hidden' : '';
}
// popstate 是唯一移除覆蓋層 DOM 的地方：state 裡有什麼就開什麼，沒有就關
window.addEventListener('popstate', (e) => {
  const st = e.state || {};
  if (st.swipe) { if (!SW.open) swShow(); } else if (SW.open) swHide();
  const l = st.detail && BY_ID.get(st.detail);
  l ? showDetail(l) : hideDetail();
  st.imp ? showImport() : hideImport();
});
document.addEventListener('keydown', (e) => {
  if (e.target.matches('input, select, textarea')) return;
  if (document.querySelector('.imp')) { if (e.key === 'Escape') closeImport(); return; }
  if (document.querySelector('.ov')) {          // 面板在最上層
    if (e.key === 'Escape') closeDetail();
    if (e.key === 'ArrowRight') gal(1);
    if (e.key === 'ArrowLeft') gal(-1);
    return;
  }
  if (document.querySelector('aside.open')) {   // 篩選抽屜
    if (e.key === 'Escape') closeFilters();
    return;
  }
  if (SW.open) {
    const front = document.querySelector('.sc.front');
    const cur = front && BY_ID.get(+front.dataset.id);
    if (e.key === 'Escape') swClose();
    else if (e.key === 'ArrowRight' && cur) swFly(front, 1, () => swCommit(cur, 'yes'));
    else if (e.key === 'ArrowLeft'  && cur) swFly(front, -1, () => swCommit(cur, 'no'));
    else if (e.key === 'Backspace' || e.key === 'z') { e.preventDefault(); swUndo(); }
  }
});

function gal(d) {
  if (galPhotos.length < 2) return;
  galIdx = (galIdx + d + galPhotos.length) % galPhotos.length;
  const ov = document.querySelector('.ov'); if (!ov) return;
  ov.querySelector('.gal img').src = galPhotos[galIdx];
  ov.querySelector('.idx').textContent = `${galIdx + 1} / ${galPhotos.length}`;
  ov.querySelectorAll('.strip img').forEach((t, i) => t.classList.toggle('on', i === galIdx));
}

function detailHtml(l) {
  const inc = (l.contains || []).map((c) => CONTAIN_LABEL[c] || c);
  const total = l.price == null ? null : l.price + (l.extraFee || 0);
  const sum = l.extraFee > 0
    ? `<div class="dsum fee">＋額外費用 ${l.extraFee.toLocaleString()} 元/月${total != null ? `　→　每月合計約 <b>${total.toLocaleString()}</b> 元` : ''}</div>`
    : l.feeIncluded ? `<div class="dsum fee inc">含管理費</div>`
    : inc.length ? `<div class="dsum fee inc">租金已含 ${inc.join('、')}</div>`
                 : `<div class="dsum fee none">未註明額外費用</div>`;

  const facts = [
    ['房型', l.layout || '—'], ['坪數', l.area ? l.area + ' 坪' : '—'],
    ['樓層', l.floor || '—'], ['類型', l.kind || '—'],
    ['每坪租金', l.area && l.price != null ? Math.round(l.price / l.area).toLocaleString() + ' 元' : '—'],
    ['裝潢', l.fitment || '—'],
    ['捷運', l.station ? `${l.station} ${l.stationDist == null ? '' : (l.stationDistApprox ? '約 ' : '') + l.stationDist + ' 公尺'}` : (l.source === 'fb' ? '未標' : '非捷運周邊')],
    ['路線', (l.lines || []).length ? l.lines.join('／') : '—'],
    ['行政區', D.district(l)], ['出租方', l.role || (l.source === 'fb' ? '見貼文' : '—')],
    ['來源', l.source === 'fb' ? `FB · ${l.group || ''}` : '591'],
    ['首次出現', new Date(l.firstSeen).toLocaleDateString('zh-TW', {month:'numeric', day:'numeric'})],
  ];

  return `<div class="dlg" role="dialog" aria-modal="true">
    <button class="x" data-x title="關閉（Esc 或上一頁）">✕</button>
    <div class="gal">
      ${galPhotos[0] ? `<img src="${galPhotos[0]}" alt="">` : `<div style="aspect-ratio:4/3;display:grid;place-items:center;color:#888;font-size:13px">${l.source === 'fb' ? `圖片 ${l.imageCount || 0} 張，在 Facebook 原文查看` : '無圖片'}</div>`}
      ${galPhotos.length > 1 ? `<button class="nav prev" data-g="-1">‹</button>
        <button class="nav next" data-g="1">›</button>
        <span class="idx">1 / ${galPhotos.length}</span>` : ''}
    </div>
    ${galPhotos.length > 1 ? `<div class="strip">${galPhotos.map((p, i) =>
      `<img src="${p}" data-t="${i}" class="${i === 0 ? 'on' : ''}" loading="lazy" alt="">`).join('')}</div>` : ''}
    <div class="dbody">
      <div class="dprice">${D.price(l)}</div>
      ${sum}
      <h2 class="dttl">${escapeHtml(l.title)}</h2>
      <div class="meta" style="font-size:12.5px">${escapeHtml(D.where(l))}</div>
      ${l.source === 'fb' ? `<div class="raw">${escapeHtml(l.raw || '')}</div>` : ''}
      <div class="facts">${facts.map(([k, v]) =>
        `<div class="fact"><div class="k">${k}</div><div class="v">${escapeHtml(v)}</div></div>`).join('')}</div>
      <div class="dtags">${l.tags.map((t) => `<span class="tg">${escapeHtml(t)}</span>`).join('')}</div>
      <div class="dacts">
        <button data-act="save" class="${LS.saved.has(l.id) ? 'on' : ''}">${LS.saved.has(l.id) ? '★ 已收藏' : '☆ 收藏'}</button>
        <button data-act="hide">${LS.hidden.has(l.id) ? '↺ 取消排除' : '✕ 排除這筆'}</button>
        <a class="go" href="${l.url}" target="_blank" rel="noopener">在 ${D.srcName(l)} 開啟 ↗</a>
      </div>
      <div class="hint">${l.source === 'fb' ? '照片和聯絡方式在 Facebook 原文' : '屋況說明、格局圖和聯絡方式要到 591 才看得到'}　·　按上一頁或 Esc 回看板</div>
    </div>
  </div>`;
}

function wireDetail(ov, l) {
  ov.querySelector('[data-x]').onclick = closeDetail;
  ov.querySelectorAll('[data-g]').forEach((b) => b.onclick = () => gal(+b.dataset.g));
  ov.querySelectorAll('.strip img').forEach((t) =>
    t.onclick = () => gal(+t.dataset.t - galIdx));
  const sv = ov.querySelector('[data-act=save]');
  sv.onclick = () => {
    LS.saved.has(l.id) ? LS.saved.delete(l.id) : LS.saved.add(l.id);
    persist('saved');
    const on = LS.saved.has(l.id);
    sv.classList.toggle('on', on); sv.textContent = on ? '★ 已收藏' : '☆ 收藏';
    render(true);   // 只重畫背後的清單，面板和相簿位置保持不動
  };
  const hd = ov.querySelector('[data-act=hide]');
  hd.onclick = () => {
    LS.hidden.has(l.id) ? LS.hidden.delete(l.id) : LS.hidden.add(l.id);
    persist('hidden');
    hd.textContent = LS.hidden.has(l.id) ? '↺ 取消排除' : '✕ 排除這筆';
    render(true);
  };
}

/* ---------- 匯入 FB 貼文（貼上 tools/fb-extract.js 的輸出）---------- */
const FB_LS = 'rent591.fbImport';
function fbLocal() { try { return JSON.parse(localStorage.getItem(FB_LS) || 'null'); } catch { return null; } }
function openImport() { history.pushState({ imp: 1 }, '', '#import'); showImport(); }
function showImport() {
  if (document.querySelector('.imp')) return;
  const ov = document.createElement('div'); ov.className = 'ov imp';
  ov.addEventListener('click', (e) => { if (e.target === ov) closeImport(); });
  ov.innerHTML = `<div class="dlg" style="max-width:640px"><button class="x" data-x>✕</button>
    <div class="dbody">
      <h2 class="dttl">匯入 FB 貼文</h2>
      <div class="meta" style="margin-bottom:10px">在已登入的社團頁執行 <code>tools/fb-extract.js</code>，JSON 會複製到剪貼簿，貼到下面。存在這個瀏覽器裡；要跨裝置請改用 <code>node tools/fb-import.mjs</code> 提交 fb.json。</div>
      <textarea placeholder='{"group":{...},"capturedAt":"...","posts":[...]}'></textarea>
      <div class="msg"></div>
      <div class="dacts"><button class="go" data-go>匯入</button><button data-clear-fb>清除本機匯入（${(fbLocal()?.listings || []).length} 筆）</button></div>
    </div></div>`;
  document.body.append(ov); document.body.style.overflow = 'hidden';
  ov.querySelector('[data-x]').onclick = closeImport;
  const msg = ov.querySelector('.msg');
  ov.querySelector('[data-go]').onclick = async () => {
    let raw; try { raw = JSON.parse(ov.querySelector('textarea').value); } catch { msg.className = 'msg err'; msg.textContent = '不是合法的 JSON'; return; }
    if (!raw || !raw.group || !Array.isArray(raw.posts)) { msg.className = 'msg err'; msg.textContent = '格式不對：要有 group 和 posts'; return; }
    const { mergeFb } = await import('./fb-listing.mjs');
    const r = mergeFb(fbLocal(), raw, DATA.mrtLines);
    localStorage.setItem(FB_LS, JSON.stringify(r.store));
    msg.className = 'msg'; msg.textContent = `匯入完成：新增 ${r.added}、更新 ${r.updated}`;
    rebuildListings(); render();
  };
  ov.querySelector('[data-clear-fb]').onclick = () => { localStorage.removeItem(FB_LS); rebuildListings(); render(); closeImport(); };
}
function closeImport() { if (history.state && history.state.imp) history.back(); else hideImport(); }
function hideImport() { document.querySelector('.imp')?.remove(); document.body.style.overflow = SW.open ? 'hidden' : ''; }

/* ---------- 篩選抽屜 ---------- */
function openFilters()  { $('#filters').classList.add('open'); }
function closeFilters() { $('#filters').classList.remove('open'); }

/* ---------- 滑卡模式 ----------
   佇列永遠是「未看 ∩ 目前篩選 ∩ 未排除 ∩ 未下架」，每次重畫都重算；
   滑過就標已看，自然掉出佇列。返回時把那張硬放回最前面（SW.force）。      */
const SW = { open: false, onlyNew: true, hist: [], force: null, photo: 0 };

function swQueue() {
  let q = DATA.listings.filter((l) => !l.gone && !LS.hidden.has(l.id) && !LS.seen.has(l.id) && matches(l));
  if (SW.onlyNew) q = q.filter(isNew);
  return q.sort((a, b) => new Date(b.firstSeen) - new Date(a.firstSeen));
}
function swOpen() { history.pushState({ swipe: 1 }, '', '#swipe'); swShow(); }
function swShow() {
  SW.open = true; SW.hist = []; SW.force = null; SW.photo = 0;
  SW.onlyNew = NEW_MEANINGFUL;   // 首輪資料全是「新」，那個開關沒意義，就先關
  if (!document.querySelector('.sw')) {
    const el = document.createElement('div'); el.className = 'sw'; document.body.append(el);
  }
  document.body.style.overflow = 'hidden';
  swDraw();
}
function swClose() { if (history.state && history.state.swipe) history.back(); else swHide(); }
function swHide() {
  SW.open = false;
  document.querySelector('.sw')?.remove();
  document.body.style.overflow = document.querySelector('.ov') ? 'hidden' : '';
}

function swPhotos(l) { return (l.photos && l.photos.length ? l.photos : [l.cover]).filter(Boolean); }

function swDraw() {
  const el = document.querySelector('.sw'); if (!el) return;
  const q = swQueue();
  const cur = SW.force && !LS.seen.has(SW.force.id) ? SW.force : q[0];
  const next = q.find((l) => l !== cur);
  const empty = SW.onlyNew
    ? '關掉「只看新上架」可以繼續滑其他沒看過的'
    : '等下一輪抓取，或到「篩選」放寬條件';
  el.innerHTML = `
    <div class="hd">
      <button data-swx title="關閉（Esc 或上一頁）">✕</button>
      <div class="t">滑卡<small>剩 ${q.length} 筆</small></div>
      <button data-swnew aria-pressed="${SW.onlyNew}">只看新上架</button>
      <button data-swfilt>篩選</button>
    </div>
    <div class="stage">
      ${next ? swCard(next, 'back') : ''}
      ${cur ? swCard(cur, 'front')
            : `<div class="swempty"><b>都看完了</b>${empty}<br><br>左滑跳過的物件在看板「全部」裡都還在</div>`}
    </div>
    <div class="swacts">
      <button class="no"  data-sw="no"   ${cur ? '' : 'disabled'} title="跳過（←）">✕</button>
      <button class="un"  data-sw="undo" ${SW.hist.length ? '' : 'disabled'} title="返回上一張（Backspace）">↩</button>
      <button class="yes" data-sw="yes"  ${cur ? '' : 'disabled'} title="收藏（→）">★</button>
    </div>`;
  el.querySelector('[data-swx]').onclick = swClose;
  el.querySelector('[data-swnew]').onclick = () => { SW.onlyNew = !SW.onlyNew; SW.force = null; SW.photo = 0; swDraw(); };
  el.querySelector('[data-swfilt]').onclick = openFilters;
  el.querySelector('[data-sw=undo]').onclick = swUndo;
  const front = el.querySelector('.sc.front');
  el.querySelector('[data-sw=no]').onclick  = () => cur && swFly(front, -1, () => swCommit(cur, 'no'));
  el.querySelector('[data-sw=yes]').onclick = () => cur && swFly(front,  1, () => swCommit(cur, 'yes'));
  if (cur) swGesture(front, cur);
}

function swCard(l, pos) {
  const ph = swPhotos(l);
  const idx = pos === 'front' ? Math.min(SW.photo, ph.length - 1) : 0;
  const inc = (l.contains || []).map((c) => CONTAIN_LABEL[c] || c);
  const feeLine = l.extraFee > 0 ? `＋額外費用 ${l.extraFee.toLocaleString()}／月${l.price != null ? `（合計約 ${(l.price + l.extraFee).toLocaleString()}）` : ''}`
                : l.feeIncluded ? '含管理費' : inc.length ? `租金含 ${inc.join('、')}` : '';
  return `<div class="sc ${pos}" data-id="${l.id}">
    ${ph.length ? `<img src="${ph[idx]}" alt="" draggable="false">` : `<div style="position:absolute;inset:0;display:grid;place-items:center;color:#888">${l.source === 'fb' ? `圖片 ${l.imageCount || 0} 張，在 Facebook 原文` : '無圖片'}</div>`}
    <div class="dots">${ph.map((_, i) => `<i class="${i === idx ? 'on' : ''}"></i>`).join('')}</div>
    ${isNew(l) ? '<span class="nb">新上架</span>' : ''}${l.source === 'fb' ? '<span class="nb" style="background:#1877f2;left:auto;right:12px">FB</span>' : ''}
    <div class="stamp like">收藏</div><div class="stamp nope">跳過</div>
    <div class="info">
      <div class="p">${D.price(l)}</div>
      ${feeLine ? `<div class="f">${feeLine}</div>` : ''}
      <div class="tt">${escapeHtml(l.title)}</div>
      <div class="m">${D.district(l)}　${D.kind(l)}　${l.layout || ''}　${D.area(l)}　${D.floor(l)}</div>
      <div class="m">${D.mrt(l)}</div>
    </div>
    <button class="det" data-det>詳細 ›</button>
  </div>`;
}

function swGesture(card, l) {
  const ph = swPhotos(l);
  const like = card.querySelector('.stamp.like'), nope = card.querySelector('.stamp.nope');
  let sx = 0, sy = 0, dx = 0, dy = 0, dragging = false, moved = false;
  card.querySelector('[data-det]').addEventListener('click', (e) => { e.stopPropagation(); openDetail(l); });
  card.addEventListener('pointerdown', (e) => {
    if (e.target.closest('[data-det]')) return;
    dragging = true; moved = false; sx = e.clientX; sy = e.clientY; dx = dy = 0;
    try { card.setPointerCapture(e.pointerId); } catch { /* 合成事件或已釋放的 pointer 沒得 capture，不影響拖曳 */ }
    card.style.transition = 'none';
  });
  card.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    dx = e.clientX - sx; dy = e.clientY - sy;
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) moved = true;
    card.style.transform = `translate(${dx}px, ${dy * 0.4}px) rotate(${dx / 18}deg)`;
    like.style.opacity = Math.min(1, Math.max(0, dx / 90));
    nope.style.opacity = Math.min(1, Math.max(0, -dx / 90));
  });
  const end = (e) => {
    if (!dragging) return; dragging = false;
    if (!moved) {   // 只是點一下：左半邊上一張照片、右半邊下一張
      if (ph.length < 2) return;
      const r = card.getBoundingClientRect();
      SW.photo = (SW.photo + ((e.clientX - r.left) < r.width / 2 ? -1 : 1) + ph.length) % ph.length;
      card.querySelector('img').src = ph[SW.photo];
      card.querySelectorAll('.dots i').forEach((d, i) => d.classList.toggle('on', i === SW.photo));
      return;
    }
    const TH = 110;
    if (dx > TH)       swFly(card,  1, () => swCommit(l, 'yes'));
    else if (dx < -TH) swFly(card, -1, () => swCommit(l, 'no'));
    else { card.style.transition = 'transform .25s'; card.style.transform = ''; like.style.opacity = nope.style.opacity = 0; }
  };
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
}
function swFly(card, dir, done) {
  if (!card) return done();
  card.style.transition = 'transform .3s ease-in, opacity .3s';
  card.style.transform = `translate(${dir * 120}vw, -20px) rotate(${dir * 25}deg)`;
  card.style.opacity = '0';
  setTimeout(done, 260);
}
function swCommit(l, act) {
  if (!l || LS.seen.has(l.id)) return;   // 防連點：同一張只處理一次
  const wasSaved = LS.saved.has(l.id);
  if (act === 'yes' && !wasSaved) { LS.saved.add(l.id); persist('saved'); }
  LS.seen.add(l.id); persist('seen');
  SW.hist.push({ l, act, wasSaved });
  SW.force = null; SW.photo = 0;
  render(true);   // 會順便 swDraw()
}
function swUndo() {
  const h = SW.hist.pop(); if (!h) return;
  LS.seen.delete(h.l.id); persist('seen');
  if (h.act === 'yes' && !h.wasSaved) { LS.saved.delete(h.l.id); persist('saved'); }
  SW.force = h.l; SW.photo = 0;
  render(true);
}

/* ---------- 事件 ---------- */
function bind() {
  $('#swOpen').onclick = swOpen;
  $('#mSwipe').onclick = swOpen;
  $('#mFilt').onclick = openFilters;
  $('#filtDone').onclick = closeFilters;
  $('#impOpen').onclick = openImport;
  $('#dist').oninput = (e) => { F.dist = +e.target.value; render(); };
  for (const [id, key] of [['#pMin','pMin'],['#pMax','pMax'],['#aMin','aMin'],['#aMax','aMax']]) {
    $(id).oninput = (e) => { F[key] = e.target.value === '' ? null : +e.target.value; render(); };
  }
  $('#sort').onchange = (e) => { F.sort = e.target.value; render(); };
  document.querySelectorAll('#viewTabs button').forEach((b) =>
    b.onclick = () => { F.view = b.dataset.view; render(); });
  document.querySelectorAll('[data-clear]').forEach((b) =>
    b.onclick = () => { F[b.dataset.clear].clear(); if (b.dataset.clear === 'lines') F.stations.clear(); render(); });
  $('#resetAll').onclick = () => {
    Object.assign(F, {lines:new Set(),stations:new Set(),districts:new Set(),layouts:new Set(),
      kinds:new Set(),tags:new Set(),contains:new Set(),sources:new Set(),role:'all',fee:'all',basis:'rent',dist:2000,
      hideUnknown:false,showSeeking:false,pMin:null,pMax:null,aMin:null,aMax:null});
    render();
  };
}

/* ---------- 啟動 ---------- */
let DISTRICTS = [], DISTRICT_COUNT = {}, STATION_COUNT = {}, TAG_COUNT = {},
    CONTAIN_COUNT = {}, SRC_COUNT = {}, KINDS = [];
let BASE = null, FB = null;   // 591 抓取結果；提交的 fb.json

// 591 + fb.json + 本機匯入 → DATA.listings。本機匯入的同 id 以較新 capturedAt 為準。
function rebuildListings() {
  const fb = new Map((FB?.listings || []).map((l) => [l.id, l]));
  for (const l of fbLocal()?.listings || []) { const p = fb.get(l.id); if (!p || l.capturedAt >= p.capturedAt) fb.set(l.id, l); }
  DATA.listings = [...BASE.listings, ...fb.values()];
  DATA.fbCount = fb.size;
  SRC_COUNT = { '591': BASE.listings.filter((l) => !l.gone).length, fb: fb.size };
  BY_ID = new Map(DATA.listings.map((l) => [l.id, l]));
}
(async function init() {
  try {
    const [res, fbRes] = await Promise.all([
      fetch('data.json?t=' + Date.now()),
      fetch('fb.json?t=' + Date.now()).catch(() => null),
    ]);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    BASE = await res.json();
    FB = fbRes && fbRes.ok ? await fbRes.json().catch(() => null) : null;   // 沒有 fb.json 也沒關係
    DATA = { ...BASE };
    rebuildListings();
  } catch (e) {
    $('#out').innerHTML = `<div class="err">讀不到 data.json：${escapeHtml(e.message)}<br>
      <small>如果是剛建好的 repo，請等 GitHub Actions 第一次跑完（或到 Actions 頁手動觸發一次）。</small></div>`;
    $('#stamp').textContent = '';
    return;
  }
  // 統計（供篩選鈕顯示數量）
  for (const l of DATA.listings) {
    if (l.district) DISTRICT_COUNT[l.district] = (DISTRICT_COUNT[l.district] || 0) + 1;
    if (l.station)  STATION_COUNT[l.station]  = (STATION_COUNT[l.station]  || 0) + 1;
    for (const t of l.tags) TAG_COUNT[t] = (TAG_COUNT[t] || 0) + 1;
    for (const c of l.contains || []) CONTAIN_COUNT[c] = (CONTAIN_COUNT[c] || 0) + 1;
  }
  const rawNew = DATA.listings.filter(
    (l) => Date.now() - new Date(l.firstSeen).getTime() < NEW_MS).length;
  NEW_MEANINGFUL = rawNew / Math.max(DATA.listings.length, 1) < 0.6;

  DISTRICTS = DISTRICT_ORDER.filter((d) => DISTRICT_COUNT[d]);
  KINDS = [...new Set(DATA.listings.map((l) => l.kind).filter(Boolean))];

  const dt = new Date(DATA.updatedAt);
  $('#stamp').innerHTML = `資料更新於 <b>${dt.toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</b>` +
    `　·　591 共 ${DATA.count.toLocaleString()} 筆` +
    (DATA.fbCount ? `　·　FB ${DATA.fbCount} 筆${FB?.importedAt ? `（匯入於 ${new Date(FB.importedAt).toLocaleDateString('zh-TW',{month:'numeric',day:'numeric'})}）` : ''}` : '');
  bind();
  render();
  // 網址帶 #p<id> 時直接開該筆（分享連結、重新整理都能回到原本看的物件）
  const m = location.hash.match(/^#p(\d+)$/);
  if (m && BY_ID.has(+m[1])) { history.replaceState({ detail: +m[1] }, '', location.hash); showDetail(BY_ID.get(+m[1])); }
  else if (location.hash === '#swipe') { history.replaceState({ swipe: 1 }, '', '#swipe'); swShow(); }
  else if (location.hash === '#import') { history.replaceState({ imp: 1 }, '', '#import'); showImport(); }
})();
</script>
